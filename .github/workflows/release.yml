name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0); this is not a preview"
        required: true

permissions:
  contents: write

concurrency:
  group: snap-version-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build distribution + publish release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: vars
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.vars.outputs.tag }}
          persist-credentials: false

      - name: Record the tagged source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test release publication safeguards without network access
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Test and build the tagged distribution
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: ./gradlew --no-daemon test installDist distZip distTar fatJar "-Pversion=$VERSION"

      - name: Smoke-test packaged launchers
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          build/install/snap-version/bin/snap-version --help
          java -jar "build/libs/snap-version-$VERSION-all.jar" --help
          test "$(build/install/snap-version/bin/snap-version --version)" = "snap-version $VERSION"
          test "$(java -jar "build/libs/snap-version-$VERSION-all.jar" --version)" = "snap-version $VERSION"

      - name: Stage distributables
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p dist
          cp "build/distributions/snap-version-$VERSION.zip" dist/
          cp "build/distributions/snap-version-$VERSION.tar" dist/
          cp "build/libs/snap-version-$VERSION-all.jar" dist/
          cd dist
          sha256sum "snap-version-$VERSION.zip" "snap-version-$VERSION.tar" "snap-version-$VERSION-all.jar" > SHA256SUMS.txt
          ls -la

      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
          BUILT_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python3 scripts/publish_release.py \
            --repository "$GH_REPOSITORY" --tag "$TAG" --commit "$BUILT_COMMIT"
